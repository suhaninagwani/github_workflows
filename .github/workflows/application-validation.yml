name: Campus Event Manager Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: validate-application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: node@v24
        with:
          channel: 'stable'
          cache: true

      - name: Display files in  the repo
        run: ls
       
      - name: Install dependencies
        run: npm ci

      - name: Analyze code
        run: npm test
        
      #- name: printing message
        #run: echo "Workflow triggered by: ${{ github.event_name }}"
      
