on: push

jobs:
  echo-hello:
    runs-on: debian-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: debian-latest
    steps:
      - name: Failed Step
        run: |
          echo "This step will fail" 
          exit 1
      - name: Say Goodbye
        run: echo "Goodbye, World!"